name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# tauri-action updates the release manifest in place, so release runs must not
# overlap even when they come from different triggers.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      # tauri-action merges each platform into one latest.json. Running the
      # publishers serially prevents concurrent jobs from overwriting entries.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build draft release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: 'Draft artifacts only. Release notes are filled before publishing.'
          releaseDraft: true
          prerelease: false
          # A universal updater is exposed under both darwin-aarch64 and
          # darwin-x86_64, which is what installed clients request.
          updaterJsonKeepUniversal: false
          # Keep CI-only release settings in this workflow.
          # Local build overlays are not used in CI.
          # string-argv preserves the quoted JSON as one --config argument.
          args: >-
            ${{ matrix.args }}
            --config '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}'

      - name: Verify macOS universal bundle
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/Session Manager.app"
          binary_path="$app_path/Contents/MacOS/session-manager"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          lipo "$binary_path" -verify_arch arm64 x86_64
          test -f "$app_path.tar.gz.sig"
