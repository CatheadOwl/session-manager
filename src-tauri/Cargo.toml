[package]
name = "session-manager"
version = "0.3.0"
description = "Local AI coding-agent session manager"
authors = ["session-manager"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "session_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5.0"
json_comments = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2.8.2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
trash = "3"
# Remote-source connection layer. default-features off: avoid aws-lc-rs
# (needs NASM on MSVC); ring backend instead.
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "3.0"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# SSH config alias resolution: parse ~/.ssh/config (incl.
# Include directives and Host patterns) to expand the sshConfig auth
# mode's alias into host/user/port/IdentityFile. default-features off:
# the `reload-ssh-algo` feature would pull a git2 build dep; the
# checked-in default algorithms are fine here. NOTE: needs rustc >= 1.88
# (the crate's MSRV); the packaged toolchain is 1.94.
ssh2-config = { version = "0.8", default-features = false }

# Console attach for the CLI branch: release builds
# are GUI-subsystem (windows_subsystem="windows"), so Win32 AttachConsole +
# SetStdHandle must re-open std handles to CONOUT$ before clap prints help.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
# (remote-source deps moved to [dependencies]: the phase 2 connection
# layer is product code; examples/remote_spike.rs builds against them.)
